    nome: CRM/ERP, clientes e financeiro
    termos: [open source crm, erp, invoicing, gestão financeira]
  - id: react-ui
    nome: Componentes React/Tailwind e dashboards
    termos: [react tailwind components, react dashboard, shadcn]
  - id: firebase-cloudflare
    nome: Firebase e Cloudflare
    termos: [firebase security rules, firebase template, cloudflare workers template, cloudflare pages]
  - id: rag-ocr
    nome: RAG, busca em documentos e OCR
    termos: [rag, document search, ocr]
  - id: social-analytics
    nome: Agendamento e analytics de redes sociais
    termos: [social media scheduling, social analytics dashboard]

    nome: Segurança
    termos: [security scanner, secret scanning, supply chain security, segurança aplicação web]
  - id: video
    nome: Edição e geração de vídeo
    termos: [remotion, ffmpeg video editing, auto subtitles, video automation, edição de vídeo]
  - id: apis
    nome: APIs
    termos: [api client, rest api toolkit, openapi generator, api gateway]
  - id: whatsapp
    nome: WhatsApp
    termos: [whatsapp cloud api, whatsapp business api, whatsapp bot, whatsapp chatbot]
    regra: whatsapp
  - id: redes-sociais
    nome: Redes sociais
    termos: [social media scheduler, instagram api, tiktok api, social media analytics]
  - id: agentes-ia
    nome: Agentes de IA, skills e subagentes para Claude Code
    termos: [claude code skills, claude code subagents, claude agents, agent skills]
  - id: mcp
    nome: Servidores MCP (conectores)
    termos: [mcp server, model context protocol server, awesome mcp]
  - id: automacao
    nome: Automação de fluxos (alternativas a n8n/Zapier)
    termos: [workflow automation, n8n alternative, zapier alternative]

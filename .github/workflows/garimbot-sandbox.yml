# Sandbox do Garimbot: vai no repositório PÚBLICO "garimbot-sandbox" em
# .github/workflows/garimbot-sandbox.yml (veja garimbot/sandbox/README.md).
# Repositório público = minutos do GitHub Actions grátis. Sem segredos: só o
# GITHUB_TOKEN automático, somente leitura, usado na busca. A máquina é
# descartável e nada do repositório auditado é executado.
name: Garimbot sandbox
on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema (veja config/temas.yml) — deixe vazio se usar termos ou link"
        required: false
      termos:
        description: "Termos separados por vírgula (busca por necessidade)"
        required: false
      link:
        description: "Link de um repositório só (porteiro: isso é seguro?)"
        required: false
      modo:
        description: "economico (padrão) ou completo"
        required: false
        default: economico
      maximo:
        description: "Quantos repositórios auditar nesta execução (vazio = o padrão do modo)"
        required: false
permissions:
  contents: read
concurrency:
  group: garimbot
  cancel-in-progress: false
jobs:
  garimpar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GARIMBOT_PASTA: ${{ github.workspace }}/trabalho/.garimbot
      GARIMBOT_DATA: ${{ github.workspace }}/trabalho/data
      GARIMBOT_RELATORIOS: ${{ github.workspace }}/trabalho/relatorios
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Ferramentas com versão fixa (conferidas pelo SHA-256)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/ferr"
          curl -sSfL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C "$HOME/ferr" gitleaks
          curl -sSfL -o "$HOME/ferr/osv-scanner" https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64
          echo "d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b  $HOME/ferr/osv-scanner" | sha256sum -c -
          chmod +x "$HOME/ferr/osv-scanner"
          python -m venv "$HOME/sg" && "$HOME/sg/bin/pip" install -q semgrep==1.182.0
          python -m venv "$HOME/gd" && "$HOME/gd/bin/pip" install -q guarddog==3.2.0
          ln -s "$HOME/sg/bin/semgrep" "$HOME/ferr/semgrep"
          ln -s "$HOME/gd/bin/guarddog" "$HOME/ferr/guarddog"
          echo "$HOME/ferr" >> "$GITHUB_PATH"
      - name: Buscar e auditar (só scripts, sem IA)
        env:
          GARIMBOT_GITHUB_TOKEN: ${{ github.token }}
          TEMA: ${{ inputs.tema }}
          TERMOS: ${{ inputs.termos }}
          LINK: ${{ inputs.link }}
          MODO: ${{ inputs.modo }}
          MAXIMO: ${{ inputs.maximo }}
        run: |
          set -euo pipefail
          sed -i "s/^modo: .*/modo: ${MODO:-economico}/" garimbot/config/limites.yml
          if [ -n "${MAXIMO:-}" ]; then
            case "$MAXIMO" in (*[!0-9]*) echo "máximo inválido"; exit 1;; esac
            sed -i "s/^  ${MODO:-economico}: .*/  ${MODO:-economico}: $MAXIMO/; s/^candidatos_busca: .*/candidatos_busca: $MAXIMO/" garimbot/config/limites.yml
          fi
          if [ -n "$LINK" ]; then
            node garimbot/scripts/garimbot.mjs analisar "$LINK" | tee saida.json
          else
            if [ -n "$TERMOS" ]; then node garimbot/scripts/garimbot.mjs buscar --termos "$TERMOS" | tee busca.json
            else node garimbot/scripts/garimbot.mjs buscar "${TEMA:-seguranca}" | tee busca.json; fi
            ID=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("busca.json","utf8")).id)')
            node garimbot/scripts/garimbot.mjs auditar "$ID" | tee saida.json
          fi
      - name: Resumo dos motivos (regra, arquivo e linha; nada do repositório é executado)
        if: always()
        run: |
          node -e '
          const fs = require("fs"), path = require("path");
          const base = "trabalho/.garimbot/quarentena/_execucoes";
          for (const e of fs.existsSync(base) ? fs.readdirSync(base) : []) {
            const f = path.join(base, e, "resultados.json");
            if (!fs.existsSync(f)) continue;
            for (const r of JSON.parse(fs.readFileSync(f, "utf8")).resultados ?? []) {
              console.log(`== ${r.nome} @ ${String(r.commit).slice(0, 12)}: ${r.script} · bloqueios ${r.bloqueios} · revisar ${r.revisar}`);
              if (r.incompletas?.length) console.log("   verificações não concluídas: " + r.incompletas.join(", "));
              for (const [n, t] of Object.entries(r.ferramentas ?? {}))
                console.log(`   ${n}: ${t.ok ? "ok" : "FALHOU · " + String(t.erro ?? "").slice(0, 160)}`);
              const bloq = (r.achados ?? []).filter((a) => a.nivel === "bloqueio");
              for (const a of bloq.slice(0, 40))
                console.log(`   - ${a.regra} · ${a.arquivo ?? ""}${a.linha ? ":" + a.linha : ""}`);
              if (bloq.length > 40) console.log(`   (+${bloq.length - 40} bloqueios)`);
            }
          }'
      - name: Guardar o resultado (pacotes de revisão + código dos que passaram no script)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: garimbot-execucao
          path: trabalho/.garimbot/quarentena/_execucoes/
          retention-days: 7
          include-hidden-files: true
  # Publica os resultados (só JSON e HTML; nunca o código auditado) no branch
  # "resultados", para a agência ler por git. Este job não toca no código de
  # terceiros: só copia os arquivos de resultado do artefato do job anterior.
  publicar:
    needs: garimpar
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: garimbot-execucao
          path: execucao
      - name: Gravar no branch resultados
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          find execucao -type d -name repos -prune -exec rm -rf {} +
          find execucao -type f ! -name '*.json' ! -name '*.html' -delete
          git init -q pub
          cd pub
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin resultados; then git checkout -q -B resultados FETCH_HEAD; else git checkout -q --orphan resultados; fi
          mkdir -p execucoes
          cp -r ../execucao/. execucoes/
          git add -A execucoes
          git -c user.name=garimbot -c user.email=garimbot@users.noreply.github.com commit -qm "Execução ${RUN_ID}" || exit 0
          git push -q origin resultados
